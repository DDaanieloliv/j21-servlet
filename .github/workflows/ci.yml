name: CI

on:
  push:
    branches:
      - main
      - 'feature/**'

  pull_request:
    branches:
      - main
      - staging
      - production

permissions:
  contents: read
  actions: write

jobs:
  test:
    name: CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Python dependencies
        run: |
          python -m venv server/.venv
          server/.venv/bin/python -m pip install \
            -r server/integration/python/requirements.txt

      - name: Run tests
        run: mvn verify

      - name: Upload build artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: server-${{ github.sha }}
          path: server/target/server-1.0-SNAPSHOT.jar
          if-no-files-found: error
          retention-days: 30
