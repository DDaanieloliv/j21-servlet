name: Production

on:
  push:
    branches:
      - production

permissions:
  actions: read
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: production

    steps:
      - name: Show production commit
        run: |
          echo "Production deployment"
          echo "Commit: ${{ github.sha }}"
          echo "Ref: ${{ github.ref }}"

      - name: Find promotion PR
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          PRODUCTION_SHA: ${{ github.sha }}
        run: |
          echo "Finding PR associated with production commit..."

          PR_JSON=$(gh api \
            "repos/${GITHUB_REPOSITORY}/commits/${PRODUCTION_SHA}/pulls")

          PR_COUNT=$(echo "$PR_JSON" | jq 'length')

          if [ "$PR_COUNT" -eq 0 ]; then
            echo "No pull request found for production commit."
            exit 1
          fi

          PR_NUMBER=$(echo "$PR_JSON" | jq -r '.[0].number')
          HEAD_SHA=$(echo "$PR_JSON" | jq -r '.[0].head.sha')
          HEAD_REF=$(echo "$PR_JSON" | jq -r '.[0].head.ref')
          BASE_REF=$(echo "$PR_JSON" | jq -r '.[0].base.ref')

          echo "Promotion PR: #$PR_NUMBER"
          echo "Head branch: $HEAD_REF"
          echo "Head SHA: $HEAD_SHA"
          echo "Base branch: $BASE_REF"

          if [ "$BASE_REF" != "production" ]; then
            echo "Associated PR does not target production."
            exit 1
          fi

          if [ "$HEAD_REF" != "staging" ]; then
            echo "Associated PR does not originate from staging."
            exit 1
          fi

          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          echo "staging_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"

      - name: Find staging promotion
        id: promotion
        env:
          GH_TOKEN: ${{ github.token }}
          STAGING_SHA: ${{ steps.pr.outputs.staging_sha }}
        run: |
          PROMOTION_NAME="staging-promotion-${STAGING_SHA}"

          echo "Looking for:"
          echo "$PROMOTION_NAME"

          ARTIFACT_JSON=$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=${PROMOTION_NAME}&per_page=100")

          ARTIFACT_ID=$(echo "$ARTIFACT_JSON" | jq -r \
            '.artifacts
             | map(select(.expired == false))
             | .[0].id')

          WORKFLOW_RUN_ID=$(echo "$ARTIFACT_JSON" | jq -r \
            '.artifacts
             | map(select(.expired == false))
             | .[0].workflow_run.id')

          if [ -z "$ARTIFACT_ID" ] || [ "$ARTIFACT_ID" = "null" ]; then
            echo "No staging promotion artifact found."
            exit 1
          fi

          if [ -z "$WORKFLOW_RUN_ID" ] || [ "$WORKFLOW_RUN_ID" = "null" ]; then
            echo "Could not determine staging workflow run."
            exit 1
          fi

          echo "Artifact ID: $ARTIFACT_ID"
          echo "Staging workflow run: $WORKFLOW_RUN_ID"

          echo "artifact_name=$PROMOTION_NAME" >> "$GITHUB_OUTPUT"
          echo "artifact_id=$ARTIFACT_ID" >> "$GITHUB_OUTPUT"
          echo "workflow_run_id=$WORKFLOW_RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Download staging promotion manifest
        uses: actions/download-artifact@v5
        with:
          name: ${{ steps.promotion.outputs.artifact_name }}
          path: promotion
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.promotion.outputs.workflow_run_id }}

      - name: Read promotion manifest
        id: manifest
        run: |
          cat promotion/promotion-manifest.txt

          BUILD_SHA=$(grep '^BUILD_SHA=' \
            promotion/promotion-manifest.txt | cut -d= -f2)

          CI_RUN_ID=$(grep '^CI_RUN_ID=' \
            promotion/promotion-manifest.txt | cut -d= -f2)

          ARTIFACT_NAME=$(grep '^ARTIFACT_NAME=' \
            promotion/promotion-manifest.txt | cut -d= -f2)

          STAGING_MERGE_SHA=$(grep '^STAGING_MERGE_SHA=' \
            promotion/promotion-manifest.txt | cut -d= -f2)

          if [ -z "$BUILD_SHA" ]; then
            echo "BUILD_SHA is missing."
            exit 1
          fi

          if [ -z "$CI_RUN_ID" ]; then
            echo "CI_RUN_ID is missing."
            exit 1
          fi

          if [ -z "$ARTIFACT_NAME" ]; then
            echo "ARTIFACT_NAME is missing."
            exit 1
          fi

          if [ -z "$STAGING_MERGE_SHA" ]; then
            echo "STAGING_MERGE_SHA is missing."
            exit 1
          fi

          echo "BUILD_SHA=$BUILD_SHA"
          echo "CI_RUN_ID=$CI_RUN_ID"
          echo "ARTIFACT_NAME=$ARTIFACT_NAME"
          echo "STAGING_MERGE_SHA=$STAGING_MERGE_SHA"

          echo "build_sha=$BUILD_SHA" >> "$GITHUB_OUTPUT"
          echo "ci_run_id=$CI_RUN_ID" >> "$GITHUB_OUTPUT"
          echo "artifact_name=$ARTIFACT_NAME" >> "$GITHUB_OUTPUT"

      - name: Download validated build artifact
        uses: actions/download-artifact@v5
        with:
          name: ${{ steps.manifest.outputs.artifact_name }}
          path: production-artifact
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.manifest.outputs.ci_run_id }}

      - name: Verify artifact
        env:
          BUILD_SHA: ${{ steps.manifest.outputs.build_sha }}
          ARTIFACT_NAME: ${{ steps.manifest.outputs.artifact_name }}
        run: |
          test -f "production-artifact/server-1.0-SNAPSHOT.jar"

          echo "Artifact being promoted to production:"
          echo "Build SHA: $BUILD_SHA"
          echo "Artifact: $ARTIFACT_NAME"

          echo "Artifact contents:"
          find production-artifact -maxdepth 2 -type f

      - name: Deploy
        env:
          BUILD_SHA: ${{ steps.manifest.outputs.build_sha }}
          ARTIFACT_NAME: ${{ steps.manifest.outputs.artifact_name }}
        run: |
          echo "Production deployment will be configured here."

          echo "Artifact: $ARTIFACT_NAME"
          echo "Build SHA: $BUILD_SHA"
